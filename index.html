<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<title>MINNO AI - Studio Magic</title>
<meta name="description" content="MINNO AI Studio Magic: chat, photo et vidéo avec l'intelligence artificielle.">
<style>
:root{--bg:#faf9f5;--side:#f3f1ea;--card:#fff;--line:#e8e6dc;--ink:#1f1e1d;--mute:#6b6a65;--acc:#c96442;--acc2:#b5553a;--soft:#f0eee6}
:root[data-theme=dark]{--bg:#262624;--side:#1f1e1d;--card:#30302e;--line:#3d3d3a;--ink:#f0eee6;--mute:#a8a69e;--soft:#30302e}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
.app{display:flex;height:100dvh}
/* Sidebar */
.side{width:284px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:90}
.brand{padding:14px 16px 6px;display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:20px;color:var(--acc);letter-spacing:.5px;white-space:nowrap}
.brand small{font-size:10.5px;color:var(--mute);letter-spacing:1.6px;text-transform:uppercase;margin:3px 0 0 30px}
.side .btn.full{margin:10px 12px 6px}
.nav{padding:4px 8px}
.nav button{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center}
.nav button:hover,.nav button.on{background:var(--soft)}
.nav button.on{font-weight:700}
.rec-title{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;padding:10px 18px 4px}
.convs{flex:1;overflow-y:auto;padding:0 8px}
.conv{display:flex;align-items:center;border-radius:10px;padding:0 4px 0 10px}
.conv:hover,.conv.on{background:var(--soft)}
.conv span{flex:1;padding:8px 0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.conv button{border:0;background:none;color:var(--mute);padding:6px 8px;opacity:.0}
.conv:hover button,.conv.on button{opacity:1}
.empty-note{font-size:12.5px;color:var(--mute);padding:6px 10px}
.me{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.me .who{flex:1;min-width:0;line-height:1.2}
.me .who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{color:var(--mute);font-size:11.5px}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:16px}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.topbar b{color:var(--acc);font-size:17px;flex:1}
.view{display:none;flex:1;min-height:0}
.view.on{display:flex;flex-direction:column}
.pad{flex:1;overflow-y:auto;padding:18px 16px 40px}
.col{max-width:760px;margin:0 auto}
h2{font-size:21px;margin-bottom:12px}
.btn{display:inline-block;border:0;border-radius:10px;background:var(--acc);color:#fff;padding:11px 18px;font-size:15px;font-weight:600}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Chat */
.msgs{flex:1;overflow-y:auto;padding:18px 16px 8px}
.msg{max-width:760px;margin:0 auto 18px;font-size:15.5px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .b{background:var(--soft);border-radius:16px;padding:9px 14px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.msg.ai .b{word-wrap:break-word}
.msg.ai .b p{margin:0 0 10px}.msg.ai .b ul,.msg.ai .b ol{margin:0 0 10px 22px}
.msg.ai .b h3,.msg.ai .b h4{margin:12px 0 6px}
.msg.ai .b code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.9em}
.msg.ai .b pre{background:#1f1e1d;color:#f0eee6;border-radius:12px;padding:12px;margin:0 0 10px;overflow-x:auto;position:relative;font-size:13px}
.msg.ai .b pre code{background:none;padding:0;color:inherit}
.msg.ai .b pre button{position:absolute;top:6px;right:6px;border:0;background:#ffffff22;color:#fff;border-radius:6px;padding:3px 8px;font-size:11px}
.msg.err .b{color:#b3261e}
.acts{display:flex;gap:6px;margin-top:4px}
.acts button{border:0;background:none;color:var(--mute);font-size:12.5px;padding:3px 6px;border-radius:6px}
.acts button:hover{background:var(--soft)}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);margin:0 2px;animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.welcome{max-width:760px;margin:8vh auto 0;text-align:center;padding:0 10px}
.welcome h1{font-size:28px;margin-bottom:6px}
.welcome p{color:var(--mute);margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13.5px}
.composer{flex:none;padding:8px 14px calc(12px + env(safe-area-inset-bottom))}
.cbox{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 10px 8px 14px;box-shadow:0 2px 10px #0000000d}
.cbox textarea{width:100%;border:0;outline:0;background:none;color:var(--ink);resize:none;font:inherit;font-size:15.5px;max-height:160px;min-height:26px;display:block}
.crow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.crow select{width:auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 10px;font-size:13px}
.send{width:36px;height:36px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:17px}
.send:disabled{opacity:.4}
.fine{text-align:center;font-size:11.5px;color:var(--mute);margin-top:6px}
/* Forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
select,textarea.f,input.f{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:10px;font:inherit}
textarea.f{min-height:84px;resize:vertical}
.opt{margin:6px 0 12px}
.opt>label{font-size:12px;color:var(--mute);display:block;margin-bottom:5px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.seg button.lock{opacity:.55}
.hint{font-size:12px;color:var(--mute);margin:4px 0 0}
.ref-row{display:flex;gap:8px;flex-wrap:wrap}
.ref-row button{padding:9px 14px;border-radius:10px;border:1px dashed var(--acc);background:var(--card);color:var(--acc);font-size:13px;font-weight:600}
.ref-sel{position:relative;display:inline-block;margin:0 0 10px}
.ref-sel img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.ref-sel button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--bg)}
.out{display:grid;gap:12px;margin-top:14px}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.res img,.res video{width:100%;border-radius:10px;display:block}
.res .acts{margin-top:6px}
.spin{padding:26px;text-align:center;color:var(--mute)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.plans{display:grid;gap:14px}
@media(min-width:900px){.plans{grid-template-columns:repeat(3,1fr)}.col.wide{max-width:960px}}
.plan h3{font-size:18px}.plan .price{font-size:30px;font-weight:800;margin:6px 0}
.plan ul{list-style:none;margin:10px 0 14px;font-size:14px}
.plan li{padding:3px 0}.plan li:before{content:"✓ ";color:var(--acc);font-weight:700}
.plan.pro{border:2px solid var(--acc)}
.plan.ultra{background:var(--acc);color:#fff;border-color:var(--acc)}
.plan.ultra li:before{color:#fff}.plan.ultra .btn{background:#fff;color:var(--acc)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}
details p{color:var(--mute);margin-top:8px;font-size:14px}
.legal h3{margin:16px 0 4px;font-size:16px}.legal p{color:var(--mute);font-size:14px}
/* Modals */
.modal{position:fixed;inset:0;background:#00000066;display:none;z-index:150;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:100%;max-width:480px;max-height:86dvh;overflow-y:auto;padding:16px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.setting{margin:12px 0}.setting>label{font-size:12px;color:var(--mute);display:block;margin-bottom:5px;font-weight:600}
#gate{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#gate.show{display:flex}
.gate-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;max-width:380px;width:100%;text-align:center}
.scrim{position:fixed;inset:0;background:#00000055;display:none;z-index:80}
@media(max-width:820px){
  .side{position:fixed;left:-300px;top:0;bottom:0;transition:left .22s}
  .side.open{left:0}.scrim.open{display:block}
  .topbar{display:flex}
}
</style>
</head>
<body>

<div id="gate"><div class="gate-box">
  <div class="brand" style="align-items:center"><b style="font-size:26px">🤖 MINNO AI</b><small style="margin:4px 0 12px">Studio Magic</small></div>
  <h2 data-i18n="gate_title"></h2>
  <p style="color:var(--mute);margin-bottom:18px" data-i18n="gate_text"></p>
  <div id="gbtn2" style="display:flex;justify-content:center"></div>
</div></div>

<div class="scrim" id="scrim" onclick="closeSide()"></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>🤖 MINNO AI</b><small>Studio Magic</small></div>
    <button class="btn full" onclick="newChat()" data-i18n="new_chat"></button>
    <nav class="nav">
      <button data-v="chat" onclick="go('chat')"><span>💬</span><span data-i18n="nav_chat"></span></button>
      <button data-v="photo" onclick="go('photo')"><span>📸</span><span data-i18n="nav_photo"></span></button>
      <button data-v="video" onclick="go('video')"><span>🎬</span><span data-i18n="nav_video"></span></button>
      <button data-v="lib" onclick="go('lib')"><span>🗂️</span><span data-i18n="nav_lib"></span></button>
      <button data-v="plans" onclick="go('plans')"><span>💎</span><span data-i18n="nav_plans"></span></button>
      <button data-v="help" onclick="go('help')"><span>❓</span><span data-i18n="nav_help"></span></button>
    </nav>
    <div class="rec-title" data-i18n="recent"></div>
    <div class="convs" id="convList"></div>
    <div class="me">
      <div class="avatar" id="avatar">👤</div>
      <div class="who"><b id="userName"></b><small id="userEmail"></small></div>
      <button class="icon" onclick="openSettings()" aria-label="Settings">⚙️</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon" onclick="openSide()" aria-label="Menu">☰</button>
      <b>MINNO AI</b>
      <button class="icon" onclick="newChat()" aria-label="New chat">✏️</button>
    </div>

    <!-- CHAT -->
    <section class="view on" id="v-chat">
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="cbox">
          <textarea id="input" rows="1" data-i18n-ph="composer_ph"></textarea>
          <div class="crow">
            <select id="chatModel"></select>
            <div style="display:flex;gap:6px">
              <button class="send" id="stopBtn" style="display:none;background:var(--ink);color:var(--bg)" onclick="stopGen()" aria-label="Stop">■</button>
              <button class="send" id="sendBtn" onclick="send()" aria-label="Send">↑</button>
            </div>
          </div>
        </div>
        <div class="fine" data-i18n="fine"></div>
      </div>
    </section>

    <!-- PHOTO -->
    <section class="view" id="v-photo"><div class="pad"><div class="col">
      <h2 data-i18n="photo_title"></h2>
      <div class="card">
        <select id="photoModel"></select>
        <textarea class="f" id="photoPrompt" data-i18n-ph="photo_ph"></textarea>
        <div class="opt"><label data-i18n="ref_label"></label><div id="refbox_photo"></div><div class="hint" data-i18n="ref_hint"></div></div>
        <div class="opt"><label data-i18n="quality"></label><div class="seg" id="seg_photoQ"></div></div>
        <div class="opt"><label data-i18n="ratio"></label><div class="seg" id="seg_photoR"></div></div>
        <button class="btn" id="photoBtn" onclick="genPhoto()" data-i18n="generate"></button>
      </div>
      <div class="out" id="photoOut"></div>
    </div></div></section>

    <!-- VIDEO -->
    <section class="view" id="v-video"><div class="pad"><div class="col">
      <h2 data-i18n="video_title"></h2>
      <div class="card">
        <select id="videoModel"></select>
        <textarea class="f" id="videoPrompt" data-i18n-ph="video_ph"></textarea>
        <div class="opt"><label data-i18n="ref_label"></label><div id="refbox_video"></div></div>
        <div class="opt"><label data-i18n="resolution"></label><div class="seg" id="seg_videoQ"></div></div>
        <div class="opt"><label data-i18n="duration"></label><div class="seg" id="seg_videoD"></div></div>
        <button class="btn" id="videoBtn" onclick="genVideo()" data-i18n="generate"></button>
      </div>
      <div class="out" id="videoOut"></div>
    </div></div></section>

    <!-- LIBRARY -->
    <section class="view" id="v-lib"><div class="pad"><div class="col">
      <h2 data-i18n="lib_title"></h2>
      <div class="grid3" id="libGrid"></div>
    </div></div></section>

    <!-- PLANS -->
    <section class="view" id="v-plans"><div class="pad"><div class="col wide">
      <h2 data-i18n="plans_title"></h2>
      <div class="plans">
        <div class="card plan"><h3 data-i18n="free"></h3><div class="price">$0</div>
          <ul><li data-i18n="f_chat"></li><li data-i18n="f_photo"></li><li data-i18n="f_q"></li><li data-i18n="f_video"></li></ul>
          <button class="btn ghost" onclick="go('chat')" data-i18n="start"></button></div>
        <div class="card plan pro"><h3>⭐ PRO</h3><div class="price">$10<small style="font-size:14px;font-weight:400" data-i18n="per_month"></small></div>
          <ul><li data-i18n="p_chat"></li><li data-i18n="p_photo"></li><li data-i18n="p_video"></li></ul>
          <button class="btn" id="payBtn1" onclick="payClick()" data-i18n="choose"></button><div id="pp_pro"></div></div>
        <div class="card plan ultra"><h3>💎 ULTRA</h3><div class="price">$20<small style="font-size:14px;font-weight:400" data-i18n="per_month"></small></div>
          <ul><li data-i18n="u_all"></li><li data-i18n="u_video"></li></ul>
          <button class="btn" id="payBtn2" onclick="payClick()" data-i18n="choose"></button><div id="pp_ultra"></div></div>
      </div>
      <p class="hint" id="payNote" style="margin-top:10px"></p>
    </div></div></section>

    <!-- HELP -->
    <section class="view" id="v-help"><div class="pad"><div class="col">
      <h2 data-i18n="faq_title"></h2>
      <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
      <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
      <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
      <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
      <div class="legal">
        <h3 data-i18n="terms_t"></h3><p data-i18n="terms_p"></p>
        <h3 data-i18n="priv_t"></h3><p data-i18n="priv_p"></p>
        <h3 data-i18n="ai_t"></h3><p data-i18n="ai_p"></p>
        <p id="contactLine" style="margin-top:12px"></p>
      </div>
    </div></div></section>
  </div>
</div>

<!-- Settings -->
<div class="modal" id="settingsModal" onclick="if(event.target===this)closeSettings()"><div class="mbox">
  <div class="mhead"><h3 data-i18n="settings"></h3><button class="icon" onclick="closeSettings()">✕</button></div>
  <div class="setting" style="text-align:center">
    <div id="gbtn" style="display:flex;justify-content:center"></div>
    <button class="btn" id="loginBtn" onclick="login()" data-i18n="login"></button>
    <button class="btn ghost" id="logoutBtn" onclick="logout()" style="display:none" data-i18n="logout"></button>
  </div>
  <div class="setting"><label data-i18n="language"></label>
    <select id="langSelect" onchange="setLang(this.value)">
      <option value="fr">🇫🇷 Français (principal)</option><option value="ht">🇭🇹 Kreyòl Ayisyen</option><option value="en">🇺🇸 English</option><option value="es">🇪🇸 Español</option>
    </select></div>
  <div class="setting"><label data-i18n="theme"></label>
    <select id="themeSelect" onchange="setTheme(this.value)">
      <option value="auto" data-i18n="theme_auto"></option><option value="light" data-i18n="theme_light"></option><option value="dark" data-i18n="theme_dark"></option>
    </select></div>
  <div class="setting"><label data-i18n="instr"></label>
    <textarea class="f" id="instrBox" maxlength="1000" data-i18n-ph="instr_ph" onchange="saveInstr()"></textarea></div>
  <div class="setting"><label data-i18n="plan_label"></label><b id="planBox"></b>
    <div class="hint" id="usageBox"></div></div>
  <div class="setting"><button class="btn ghost sm" onclick="clearData()" data-i18n="clear"></button></div>
</div></div>

<!-- Library picker / viewer -->
<div class="modal" id="pickModal" onclick="if(event.target===this)closePick()"><div class="mbox">
  <div class="mhead"><h3 data-i18n="lib_title"></h3><button class="icon" onclick="closePick()">✕</button></div>
  <div class="grid3" id="pickGrid"></div>
</div></div>
<div class="modal" id="adModal"><div class="mbox" style="text-align:center">
  <div class="mhead"><h3 data-i18n="ad_title"></h3><span></span></div>
  <div id="adSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;overflow:hidden"></div>
  <p id="adWait" class="hint" style="margin:10px 0;font-weight:600"></p>
  <button class="btn" id="adGo" onclick="adDone()" data-i18n="ad_go" disabled></button>
  <p class="hint" style="margin-top:8px" data-i18n="ad_pro"></p>
  <button class="btn sm ghost" style="margin-top:6px" onclick="adCancel()">✕</button>
</div></div>
<div class="modal" id="viewModal" onclick="if(event.target===this)closeView()"><div class="mbox">
  <div class="mhead"><span></span><button class="icon" onclick="closeView()">✕</button></div>
  <img id="viewImg" style="width:100%;border-radius:12px" alt="">
  <p id="viewPrompt" class="hint" style="margin:8px 0"></p>
  <div class="acts" style="flex-wrap:wrap">
    <button class="btn sm" onclick="dlCur()" data-i18n="download"></button>
    <button class="btn sm ghost" onclick="refFromView()" data-i18n="use_ref"></button>
    <button class="btn sm ghost" onclick="delCur()" data-i18n="delete"></button>
  </div>
</div></div>

<script>
/* ===== Konfigirasyon ===== */
const GOOGLE_CLIENT_ID = '';      // Client ID Google (Google Cloud Console)
const REQUIRE_LOGIN = true;       // aktif sèlman si GOOGLE_CLIENT_ID ranpli
const AD_CODE = '';               // kole kòd piblisite a ant gèmè yo (HTML/script). Si vid, pa gen piblisite.
const AD_SECONDS = 30;            // dire piblisite avan telechajman (plan gratis sèlman)
const PAYPAL_CLIENT_ID = '';      // PayPal Client ID (piblik, sa a ka isit la)
const PAYPAL_PLAN_PRO = '';       // ID plan Pro a (P-XXXX) kreye sou PayPal
const PAYPAL_PLAN_ULTRA = '';     // ID plan Ultra a (P-XXXX) kreye sou PayPal
const CONTACT = '';               // imèl kontak ou (opsyonèl), pa egzanp 'kontak@sit-ou.com'

const MODELS_UI = {
  chat:  [['gemini','Gemini'],['grok','Grok']],
  photo: [['nano-banana-2','Nano Banana 2'],['grok-imagine','Grok Imagine']],
  video: [['omni-flash','Omni 1.1 Flash',10],['grok-imagine','Grok Imagine',15]]
};

/* ===== Éta ak depo lokal ===== */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const $=id=>document.getElementById(id);
function detectLang(){try{const l=((navigator.languages&&navigator.languages[0])||navigator.language||'fr').toLowerCase().slice(0,2);return ['fr','ht','en','es'].includes(l)?l:'fr'}catch(e){return 'fr'}}
let SET=Object.assign({lang:detectLang(),theme:'auto',instr:'',chatModel:'gemini'},LS.get('mn_set',{}));
if(!T[SET.lang])SET.lang='fr';
let convs=LS.get('mn_convs',[]);
let curId=LS.get('mn_cur',null);
let gallery=LS.get('mn_gallery',[]);
let plan=0;
let ME={enforced:false,limits:null,usage:{chat:0,photo:0,video:0}};
let user=LS.get('mn_user',null);
let token=null;try{token=sessionStorage.getItem('mn_token')}catch(e){}
let busy=false,ctrl=null,view='chat';

const SEL={photoQ:'std',photoR:'1:1',videoQ:'480',videoD:'5'};

function t(k){return (T[SET.lang]&&T[SET.lang][k])||T.fr[k]||k}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function saveSet(){LS.set('mn_set',SET)}
function saveConvs(){
  convs=convs.slice(0,50);
  if(!LS.set('mn_convs',convs)){convs=convs.slice(0,20);LS.set('mn_convs',convs)}
  LS.set('mn_cur',curId);
}

/* ===== Lang ak tèm ===== */
function applyLang(){
  document.documentElement.lang=SET.lang;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  $('langSelect').value=SET.lang;$('themeSelect').value=SET.theme;$('instrBox').value=SET.instr||'';
  $('planBox').textContent=t('plan'+plan);
  $('contactLine').innerHTML=CONTACT?esc(t('contact'))+'<a href="mailto:'+esc(CONTACT)+'">'+esc(CONTACT)+'</a>':'';
  renderUser();renderUsage();renderList();renderChat();renderAllSeg();renderRef('photo');renderRef('video');
}
function setLang(v){SET.lang=v;saveSet();applyLang()}
function applyTheme(){
  const dark=SET.theme==='dark'||(SET.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
}
function setTheme(v){SET.theme=v;saveSet();applyTheme()}
function saveInstr(){SET.instr=$('instrBox').value.slice(0,1000);saveSet()}

/* ===== Navigasyon ===== */
function openSide(){$('side').classList.add('open');$('scrim').classList.add('open')}
function closeSide(){$('side').classList.remove('open');$('scrim').classList.remove('open')}
function go(v){
  view=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='lib')renderLib();
  closeSide();
}
function openSettings(){closeSide();$('settingsModal').classList.add('open')}
function closeSettings(){$('settingsModal').classList.remove('open')}
function clearData(){
  if(!confirm(t('clear_q')))return;
  ['mn_convs','mn_cur','mn_gallery'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  convs=[];curId=null;gallery=[];renderList();renderChat();renderLib();alert(t('clear_ok'));
}

/* ===== Limit chak jou ===== */
function today(){return new Date().toISOString().slice(0,10)}
function lim(k){return (ME.limits&&ME.limits[k])||LIMITS[k]}
function used(k){return ME.enforced?(ME.usage[k]||0):LS.get('mn_u_'+k+'_'+today(),0)}
function bump(k){if(ME.enforced)ME.usage[k]=(ME.usage[k]||0)+1;else LS.set('mn_u_'+k+'_'+today(),used(k)+1);renderUsage()}
function allowed(k){if(!ME.enforced&&plan>0)return true;return used(k)<lim(k)}
async function loadMe(){
  if(!token&&GOOGLE_CLIENT_ID){plan=0;ME={enforced:false,limits:null,usage:{chat:0,photo:0,video:0}};return}
  try{const j=await api('/api/me');ME={enforced:!!j.enforced,limits:j.limits||null,usage:j.usage||{chat:0,photo:0,video:0}};plan=j.plan|0}
  catch(e){if(e.status===401)return;plan=0}
  renderUsage();renderAllSeg();renderPay();
}
function renderUsage(){
  const f=k=>Math.max(0,lim(k)-used(k));
  $('usageBox').textContent=t('usage')+': 💬 '+f('chat')+' · 📸 '+f('photo')+' · 🎬 '+f('video')+' ('+t('left')+')';
}

/* ===== Itilizatè / Google ===== */
function renderUser(){
  $('userName').textContent=user?user.name:t('visitor');
  $('userEmail').textContent=user?user.email:t('notconn');
  $('loginBtn').style.display=user?'none':'inline-block';
  $('logoutBtn').style.display=user?'inline-block':'none';
  $('gate').classList.toggle('show',REQUIRE_LOGIN&&!!GOOGLE_CLIENT_ID&&!user);
  const av=$('avatar');av.innerHTML='';
  if(user&&user.picture){const i=document.createElement('img');i.src=user.picture;av.appendChild(i)}else av.textContent='👤';
}
function onCred(resp){
  try{

    user={name:p.name,email:p.email,picture:p.picture};token=resp.credential;
    LS.set('mn_user',user);try{sessionStorage.setItem('mn_token',token)}catch(e){}
    renderUser();loadMe();

}

/* ===== API (sèvè nou) ===== */
async function api(path,body,signal){
  const headers={'Content-Type':'application/json'};
  if(token)headers.Authorization='Bearer '+token;
  const r=await fetch(path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,signal});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((j&&j.error)||('HTTP '+r.status));e.status=r.status;throw e}
  return j||{};
}
function errMsg(e){
  if(e.status===404)return t('nobackend');
  if(e.status===401){logout();return t('login_needed')}
  if(e.status===501)return t('unavailable');
  if(e.status===429)return t('limit');
  if(e.status===403)return t('locked');
  return (e.message&&e.message.length<220&&!/^HTTP/.test(e.message))?e.message:t('err');
}

/* ===== Markdown senp ===== */
function md(src){
  const blocks=[];
  let s=String(src).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{blocks.push(c.replace(/\n$/,''));return '\u0001'+(blocks.length-1)+'\u0001'});
  s=esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out='',list='',para=[];
  const flushP=()=>{if(para.length){out+='<p>'+para.join('<br>')+'</p>';para=[]}};
  const flushL=()=>{if(list){out+='</'+list+'>';list=''}};
  s.split('\n').forEach(line=>{
    let m;
    if((m=line.match(/^\s*[-*]\s+(.*)/))){flushP();if(list!=='ul'){flushL();out+='<ul>';list='ul'}out+='<li>'+m[1]+'</li>'}
    else if((m=line.match(/^\s*\d+[.)]\s+(.*)/))){flushP();if(list!=='ol'){flushL();out+='<ol>';list='ol'}out+='<li>'+m[1]+'</li>'}
    else if((m=line.match(/^#{1,4}\s+(.*)/))){flushP();flushL();out+='<h3>'+m[1]+'</h3>'}
    else if(line.trim()===''){flushP();flushL()}
    else{flushL();para.push(line)}
  });
  flushP();flushL();
  return out.replace(/\u0001(\d+)\u0001/g,(m,i)=>'<pre><button data-copy="1">'+esc(t('copy'))+'</button><code>'+esc(blocks[+i])+'</code></pre>');
}
function copyText(txt,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent=t('copied');setTimeout(()=>btn.textContent=o,1200)}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,done)}
  else{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}
}

/* ===== Chat ===== */
function cur(){return convs.find(c=>c.id===curId)||null}
function newChat(){curId=null;saveConvs();go('chat');renderList();renderChat();$('input').focus();closeSide()}
function selectConv(id){curId=id;saveConvs();go('chat');renderList();renderChat()}
function delConv(id){convs=convs.filter(c=>c.id!==id);if(curId===id)curId=null;saveConvs();renderList();renderChat()}
function renderList(){
  const box=$('convList');box.innerHTML='';
  if(!convs.length){box.innerHTML='<div class="empty-note">'+esc(t('no_recent'))+'</div>';return}
  convs.forEach(c=>{
    const d=document.createElement('div');d.className='conv'+(c.id===curId?' on':'');
    const sp=document.createElement('span');sp.textContent=c.title||'…';sp.onclick=()=>selectConv(c.id);
    const b=document.createElement('button');b.textContent='✕';b.setAttribute('aria-label','Delete');b.onclick=e=>{e.stopPropagation();delConv(c.id)};
    d.appendChild(sp);d.appendChild(b);box.appendChild(d);
  });
}
function renderChat(){
  const box=$('msgs');box.innerHTML='';
  const c=cur();
  if(!c||!c.messages.length){
    const w=document.createElement('div');w.className='welcome';
    w.innerHTML='<h1>'+esc(t('welcome_title'))+'</h1><p>'+esc(t('welcome_sub'))+'</p><div class="chips"></div>';
    ['s1','s2','s3'].forEach(k=>{const b=document.createElement('button');b.textContent=t(k);b.onclick=()=>{$('input').value=t(k);send()};w.querySelector('.chips').appendChild(b)});
    box.appendChild(w);return;
  }
  c.messages.forEach((m,i)=>{
    const d=document.createElement('div');
    if(m.role==='user'){d.className='msg user';d.innerHTML='<div class="b">'+esc(m.content)+'</div>'}
    else{
      d.className='msg ai'+(m.error?' err':'');
      d.innerHTML='<div class="b">'+md(m.content)+'</div>';
      const a=document.createElement('div');a.className='acts';
      const cb=document.createElement('button');cb.textContent='⧉ '+t('copy');cb.onclick=()=>copyText(m.content,cb);a.appendChild(cb);
      if(i===c.messages.length-1){const rb=document.createElement('button');rb.textContent='↻ '+t('regen');rb.onclick=regen;a.appendChild(rb)}
      d.appendChild(a);
    }
    box.appendChild(d);
  });
  box.querySelectorAll('pre button[data-copy]').forEach(b=>b.onclick=()=>copyText(b.parentNode.querySelector('code').textContent,b));
  if(busy){const d=document.createElement('div');d.className='msg ai';d.innerHTML='<div class="b dots"><span></span><span></span><span></span></div>';box.appendChild(d)}
  box.scrollTop=box.scrollHeight;
}
function setBusy(b){busy=b;$('sendBtn').style.display=b?'none':'';$('stopBtn').style.display=b?'':'none'}
async function send(){
  const inp=$('input'),txt=inp.value.trim();
  if(!txt||busy)return;
  if(!allowed('chat')){alert(t('limit'));return}
  let c=cur();
  if(!c){c={id:'c'+Date.now(),title:'',model:$('chatModel').value,messages:[],ts:Date.now()};convs.unshift(c);curId=c.id}
  c.model=$('chatModel').value;
  c.messages.push({role:'user',content:txt});
  if(!c.title)c.title=txt.slice(0,40);
  inp.value='';autosize();saveConvs();renderList();
  await generate(c);
}
async function generate(c){
  setBusy(true);renderChat();
  ctrl=new AbortController();
  try{
    const msgs=c.messages.filter(m=>!m.error).slice(-20).map(m=>({role:m.role,content:m.content}));
    const j=await api('/api/chat',{model:c.model,messages:msgs,lang:SET.lang,instructions:SET.instr},ctrl.signal);
    c.messages.push({role:'assistant',content:j.text||'…'});bump('chat');
  }catch(e){
    if(e.name!=='AbortError')c.messages.push({role:'assistant',content:'⚠️ '+errMsg(e),error:true});
  }
  setBusy(false);ctrl=null;saveConvs();renderChat();
}
function stopGen(){if(ctrl)ctrl.abort()}
async function regen(){
  const c=cur();if(!c||busy)return;
  while(c.messages.length&&c.messages[c.messages.length-1].role==='assistant')c.messages.pop();
  if(!c.messages.length)return;
  await generate(c);
}
function autosize(){const i=$('input');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,160)+'px'}

/* ===== Foto referans ===== */
function shrink(src,max,q){
  return new Promise((ok,ko)=>{
    const im=new Image();
    im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*r),h=Math.round(im.height*r);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      ok(c.toDataURL('image/jpeg',q));
    };
    im.onerror=ko;im.src=src;
  });
}
function renderRef(target){
  const box=$('refbox_'+target);box.innerHTML='';
  if(REF[target]){
    const w=document.createElement('div');w.className='ref-sel';
    const i=document.createElement('img');i.src=REF[target];
    const x=document.createElement('button');x.textContent='✕';x.onclick=()=>{REF[target]='';renderRef(target)};
    w.appendChild(i);w.appendChild(x);box.appendChild(w);
  }
  const row=document.createElement('div');row.className='ref-row';
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.style.display='none';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>shrink(fr.result,1024,.85).then(d=>{REF[target]=d;renderRef(target)}).catch(()=>alert(t('err')));
    fr.readAsDataURL(f);
  };
  const b1=document.createElement('button');b1.textContent=t('ref_gal');b1.onclick=()=>inp.click();
  const b2=document.createElement('button');b2.textContent=t('ref_lib');b2.onclick=()=>openPick(target);
  row.appendChild(inp);row.appendChild(b1);row.appendChild(b2);box.appendChild(row);
}
function openPick(target){
  const g=$('pickGrid');g.innerHTML='';
  if(!gallery.length){g.style.display='block';g.textContent=t('lib_empty')}
  else{g.style.display='grid';gallery.forEach(it=>{const i=document.createElement('img');i.src=it.thumb;i.onclick=()=>{REF[target]=it.thumb;renderRef(target);closePick()};g.appendChild(i)})}
  $('pickModal').classList.add('open');
}
function closePick(){$('pickModal').classList.remove('open')}

/* ===== Bibliyotèk ===== */
let viewing=null;
function addGallery(dataUrl,prompt,model){
  shrink(dataUrl,512,.75).then(th=>{
    gallery.unshift({id:'g'+Date.now(),thumb:th,prompt:prompt,model:model,ts:Date.now()});
    gallery=gallery.slice(0,40);
    while(gallery.length&&!LS.set('mn_gallery',gallery))gallery.pop();
    if(view==='lib')renderLib();
  }).catch(()=>{});
}
function renderLib(){
  const g=$('libGrid');g.innerHTML='';
  if(!gallery.length){g.style.display='block';g.innerHTML='<p class="hint">'+esc(t('lib_empty'))+'</p>';return}
  g.style.display='grid';
  gallery.forEach(it=>{const i=document.createElement('img');i.src=it.thumb;i.onclick=()=>{viewing=it;$('viewImg').src=it.thumb;$('viewPrompt').textContent=it.prompt||'';$('viewModal').classList.add('open')};g.appendChild(i)});
}
function closeView(){$('viewModal').classList.remove('open')}
function dlRaw(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}

/* ===== Peman PayPal ===== */
let ppLoaded=false,ppRendered=false;
function payClick(){
  if(!PAYPAL_CLIENT_ID||!PAYPAL_PLAN_PRO){alert(t('soon'));return}
  if(GOOGLE_CLIENT_ID&&!user){alert(t('pay_login'));return}
  if(!ME.enforced){alert(t('soon'));return}
}
function renderPay(){
  const on=!!(PAYPAL_CLIENT_ID&&PAYPAL_PLAN_PRO&&ME.enforced&&user);
  $('payBtn1').style.display=on?'none':'';$('payBtn2').style.display=on?'none':'';
  $('payNote').textContent=on?(plan>0?t('pay_cancel'):''):'';
  if(!on||plan>0){$('pp_pro').innerHTML='';$('pp_ultra').innerHTML='';ppRendered=false;return}
  if(ppRendered)return;
  const draw=()=>{
    if(!window.paypal)return;ppRendered=true;
    [['pp_pro',PAYPAL_PLAN_PRO],['pp_ultra',PAYPAL_PLAN_ULTRA]].forEach(([id,pid])=>{
      if(!pid)return;
      paypal.Buttons({style:{layout:'vertical',shape:'rect',label:'subscribe'},
        createSubscription:(d,a)=>a.subscription.create({plan_id:pid}),
        onApprove:async d=>{try{await api('/api/paypal',{subscriptionID:d.subscriptionID});ppRendered=false;await loadMe();alert(t('pay_ok'))}catch(e){alert(e.status===409?t('pay_used'):t('pay_fail'))}},
        onError:()=>alert(t('pay_fail'))}).render('#'+id);
    });
  };
  if(window.paypal){draw();return}
  if(ppLoaded)return;ppLoaded=true;
  const sc=document.createElement('script');
  sc.src='https://www.paypal.com/sdk/js?client-id='+encodeURIComponent(PAYPAL_CLIENT_ID)+'&vault=true&intent=subscription';
  sc.onload=draw;sc.onerror=()=>{ppLoaded=false};document.head.appendChild(sc);
}

/* ===== Piblisite avan telechajman (plan gratis) ===== */
let adTimer=null,adCb=null;
function adDone(){const cb=adCb;adCancel();if(cb)cb()}
function adCancel(){clearInterval(adTimer);adCb=null;$('adModal').classList.remove('open');$('adSlot').innerHTML=''}
function withAd(cb){
  if(plan>0||!AD_CODE.trim()){cb();return}
  adCb=cb;const slot=$('adSlot');slot.innerHTML='';
  try{slot.appendChild(document.createRange().createContextualFragment(AD_CODE))}catch(e){}
  let n=AD_SECONDS;const w=$('adWait'),g=$('adGo');g.disabled=true;
  w.textContent=t('ad_wait').replace('{n}',n);
  $('adModal').classList.add('open');
  clearInterval(adTimer);
  adTimer=setInterval(()=>{n--;if(n>0){w.textContent=t('ad_wait').replace('{n}',n)}else{clearInterval(adTimer);w.textContent='';g.disabled=false}},1000);
}

/* ===== Foto ===== */
async function genPhoto(){
  const p=$('photoPrompt').value.trim();if(!p)return;
  if(!allowed('photo')){alert(t('limit'));return}
  const btn=$('photoBtn'),out=$('photoOut'),model=$('photoModel').value;
  const card=document.createElement('div');card.className='res';card.innerHTML='<div class="spin">'+esc(t('working'))+'</div>';
  out.prepend(card);btn.disabled=true;
  try{
    const j=await api('/api/image',{model:model,prompt:p,ratio:SEL.photoR,quality:SEL.photoQ,reference:REF.photo||null,lang:SET.lang});
    if(!j.image)throw new Error(t('err'));
    card.innerHTML='';
    const im=document.createElement('img');im.src=j.image;im.alt=p;card.appendChild(im);
    const a=document.createElement('div');a.className='acts';
    const d=document.createElement('button');d.textContent='⬇ '+t('download');d.onclick=()=>dlData(j.image,'minno-photo.png');
    const u=document.createElement('button');u.textContent='🖼️ '+t('use_ref');u.onclick=()=>{REF.photo=j.image;shrink(j.image,1024,.85).then(x=>{REF.photo=x;renderRef('photo')})};
    a.appendChild(d);a.appendChild(u);card.appendChild(a);
    bump('photo');addGallery(j.image,p,model);
  }catch(e){card.innerHTML='<div class="spin" style="color:#b3261e">⚠️ '+esc(errMsg(e))+'</div>'}
  btn.disabled=false;
}

/* ===== Videyo ===== */
async function genVideo(){
  const p=$('videoPrompt').value.trim();if(!p)return;
  if(!allowed('video')){alert(t('limit'));return}
  const btn=$('videoBtn'),out=$('videoOut'),model=$('videoModel').value;
  const card=document.createElement('div');card.className='res';card.innerHTML='<div class="spin">'+esc(t('working'))+'</div>';
  out.prepend(card);btn.disabled=true;
  try{
    let j=await api('/api/video',{model:model,prompt:p,duration:+SEL.videoD,resolution:SEL.videoQ,reference:REF.video||null,lang:SET.lang});
    let tries=0;
    while(j.job&&!j.url&&tries<60){await new Promise(r=>setTimeout(r,5000));j=await api('/api/video?job='+encodeURIComponent(j.job));tries++}
    if(!j.url)throw new Error(t('err'));
    card.innerHTML='';
    const v=document.createElement('video');v.src=j.url;v.controls=true;v.playsInline=true;v.autoplay=true;v.loop=true;card.appendChild(v);
    const a=document.createElement('div');a.className='acts';
    const d=document.createElement('button');d.textContent='⬇ '+t('download');d.onclick=()=>dlData(j.url,'minno-video.mp4');a.appendChild(d);card.appendChild(a);
    bump('video');
  }catch(e){card.innerHTML='<div class="spin" style="color:#b3261e">⚠️ '+esc(errMsg(e))+'</div>'}
  btn.disabled=false;
}
