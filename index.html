*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#e8e8ef;min-height:100vh}
header{background:linear-gradient(135deg,#6d28d9,#db2777);padding:18px;text-align:center;position:sticky;top:0;z-index:10}
nav{display:flex;gap:8px;padding:12px;background:#12121a;overflow-x:auto;position:sticky;top:78px;z-index:9}
nav button{flex:1;min-width:90px;padding:10px 14px;border-radius:12px;border:1px solid #2a2a3a;background:#1c1c28;color:#fff;font-weight:600;cursor:pointer}
nav button.active{background:#6d28d9}
.container{max-width:900px;margin:0 auto;padding:16px}
.card{background:#15151f;border:1px solid #232334;border-radius:16px;padding:16px;margin-bottom:16px}
.btn{padding:10px 16px;border-radius:10px;border:0;background:#6d28d9;color:#fff;font-weight:700;cursor:pointer;width:100%}
.btn-secondary{background:#2a2a3a}
.input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a3a;background:#0f0f15;color:#fff;margin:6px 0 12px}
.chat-box{height:42vh;overflow-y:auto;background:#0f0f15;border-radius:12px;padding:12px;border:1px solid #232334;margin-bottom:10px}
.msg{margin:8px 0;padding:10px 12px;border-radius:12px;max-width:85%}
.user{background:#6d28d9;margin-left:auto}
.ai{background:#1e1e2e}
.small{font-size:12px;opacity:.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.show{display:flex}
.modal-card{background:#181825;border:1px solid #333;padding:20px;border-radius:16px;width:100%;max-width:500px}
</style>
</head>
