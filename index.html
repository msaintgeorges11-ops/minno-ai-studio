<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINNO AI - Studio Magic</title>
<meta name="description" content="MINNO AI: chat, photo et vidéo avec l'intelligence artificielle.">
<style>
:root{--bg:#faf9f5;--card:#fff;--line:#e8e6dc;--ink:#1f1e1d;--mute:#6b6a65;--acc:#c96442;--acc2:#b5553a;--soft:#f0eee6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px;width:100%}
header{flex:none;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-weight:800;font-size:20px;color:var(--acc);letter-spacing:.5px;white-space:nowrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand small{font-size:11px;color:var(--mute);letter-spacing:1.5px;text-transform:uppercase;margin-left:34px;margin-top:2px}
.icon{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;cursor:pointer;font-size:16px}
.btn{display:inline-block;border:0;border-radius:10px;background:var(--acc);color:#fff;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
main.wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.tabs{flex:none;display:flex;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 2px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tool{display:none}
.tool.on{display:block;flex:1;min-height:0;overflow-y:auto;padding:12px 0 24px}
h2{font-size:20px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
select,textarea,input[type=url]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:10px;font:inherit}
textarea{min-height:80px;resize:vertical}
.opt{margin:6px 0 12px}
.opt>label{font-size:12px;color:var(--mute);display:block;margin-bottom:5px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.seg button.lock{opacity:.55}
.ref-row{display:flex;gap:8px;flex-wrap:wrap}
.ref-row button{padding:9px 14px;border-radius:10px;border:1px dashed var(--acc);background:#fff;color:var(--acc);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ref-sel{position:relative;display:inline-block;margin:0 0 10px}
.ref-sel img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.ref-sel button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer}
#lib{position:fixed;inset:0;background:#00000066;display:none;z-index:150;align-items:flex-end;justify-content:center}
#lib.open{display:flex}
.lib-box{background:#fff;width:100%;max-width:560px;max-height:80dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px}
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lib-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.hint{font-size:12px;color:var(--mute);margin:-4px 0 10px}
.res{width:100%;border-radius:12px;margin-top:12px;border:1px solid var(--line)}
/* Chat: pran tout espas la */
#chat.tool.on{display:flex;flex-direction:column;overflow:hidden;padding:10px 0}
#chat h2{display:none}
#chat .card{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-box{order:1;flex:1;min-height:0;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 10px}
#chatInput{order:2;min-height:56px;max-height:110px}
#sendBtn{order:3;width:100%}
.msg{padding:8px 12px;border-radius:12px;margin-bottom:8px;max-width:88%;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{background:var(--acc);color:#fff;margin-left:auto}
.msg.ai{background:var(--soft)}
.msg small{display:block;opacity:.6;font-size:11px;margin-bottom:2px}
.grid{display:grid;gap:14px}
@media(min-width:720px){.grid.three{grid-template-columns:repeat(3,1fr)}}
.plan h3{font-size:18px}
.plan .price{font-size:30px;font-weight:800;margin:6px 0}
.plan ul{list-style:none;margin:10px 0 14px;font-size:14px}
.plan li{padding:3px 0}.plan li:before{content:"✓ ";color:var(--acc);font-weight:700}
.plan.pro{border:2px solid var(--acc)}
.plan.ultra{background:var(--acc);color:#fff;border-color:var(--acc)}
.plan.ultra li:before{color:#fff}
.plan.ultra .btn{background:#fff;color:var(--acc)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}
details p{color:var(--mute);margin-top:8px;font-size:14px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
#gate{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#gate.show{display:flex}
.gate-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 22px;max-width:380px;width:100%;text-align:center}
#overlay{position:fixed;inset:0;background:#00000055;display:none;z-index:98}
#overlay.open{display:block}
#side{position:fixed;top:0;right:-100%;width:88%;max-width:340px;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 90px;background:#fff;border-left:1px solid var(--line);z-index:99;transition:right .25s}
#side.open{right:0}
.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.profile{text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--acc);color:#fff;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.setting{margin:14px 0}
.setting label{font-size:12px;color:var(--mute);display:block;margin-bottom:5px}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div class="logo" style="font-size:26px">🤖 MINNO AI</div>
    <div style="font-size:12px;color:var(--mute);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">Studio Magic</div>
    <h2 data-i18n="gate_title"></h2>
    <p style="color:var(--mute);margin-bottom:18px" data-i18n="gate_text"></p>
    <div id="gbtn2" style="display:flex;justify-content:center"></div>
  </div>
</div>
<div id="overlay" onclick="closeSide()"></div>
<aside id="side" aria-label="Settings">
  <div class="side-head"><h3 data-i18n="settings"></h3><button class="icon" onclick="closeSide()">✕</button></div>
  <div class="profile">
    <div class="avatar" id="avatar">👤</div>
    <div id="userName" style="font-weight:700"></div>
    <small id="userEmail" style="color:var(--mute)"></small>
    <div style="margin-top:10px">
      <div id="gbtn"></div>
      <button class="btn" id="loginBtn" onclick="login()" data-i18n="login"></button>
      <button class="btn ghost" id="logoutBtn" onclick="logout()" style="display:none" data-i18n="logout"></button>
    </div>
  </div>
  <div class="setting">
    <label data-i18n="language"></label>
    <select id="langSelect" onchange="changeLang(this.value)">
      <option value="fr">🇫🇷 Français (principal)</option>
      <option value="ht">🇭🇹 Kreyòl Ayisyen</option>
      <option value="en">🇺🇸 English</option>
    </select>
  </div>
  <div class="setting">
    <label data-i18n="plan_label"></label>
    <div style="font-weight:700" id="planBox"></div>
    <button class="btn" style="margin-top:8px" onclick="showTab('plans');closeSide()" data-i18n="see_plans"></button>
  </div>
  <div class="setting">
    <label data-i18n="usage"></label>
    <div class="note" id="usageBox"></div>
  </div>
</aside>

<header>
  <div class="wrap bar">
    <a href="#chat" class="brand"><span class="logo">🤖 MINNO AI</span><small>Studio Magic</small></a>
    <button class="icon" onclick="openSide()" aria-label="Settings">⚙️</button>
  </div>
</header>

<main class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="chat" onclick="showTab('chat')" data-i18n="nav_chat"></button>
    <button class="tab" data-tab="photo" onclick="showTab('photo')" data-i18n="nav_photo"></button>
    <button class="tab" data-tab="video" onclick="showTab('video')" data-i18n="nav_video"></button>
    <button class="tab" data-tab="plans" onclick="showTab('plans')" data-i18n="nav_plans"></button>
    <button class="tab" data-tab="faq" onclick="showTab('faq')" data-i18n="nav_faq"></button>
  </div>

  <section id="chat" class="tool on">
    <h2 data-i18n="chat_title"></h2>
    <div class="card">
      <select id="chatModel">
        <option value="gemini">Gemini</option>
        <option value="llama">Meta Llama</option>
        <option value="openai">ChatGPT</option>
        <option value="mistral">Mistral</option>
      </select>
      <textarea id="chatInput" data-i18n-ph="chat_ph"></textarea>
      <button class="btn" id="sendBtn" onclick="sendChat()" data-i18n="send"></button>
      <div class="chat-box" id="chatBox"></div>
    </div>
  </section>

  <section id="photo" class="tool">
    <h2 data-i18n="photo_title"></h2>
    <div class="card">
      <select id="photoModel">
        <option value="nanobanana">Nano Banana</option>
        <option value="gptimage">ChatGPT Image</option>
        <option value="seedream">Seedream</option>
        <option value="flux">Flux</option>
      </select>
      <textarea id="photoPrompt" data-i18n-ph="photo_ph"></textarea>

      <div class="opt">
        <label data-i18n="ref_label"></label>
        <div class="refbox" id="refbox_photo"></div>
        <div class="hint" data-i18n="ref_hint"></div>
      </div>
      <div class="opt"><label data-i18n="quality"></label><div class="seg" id="seg_photoQ"></div></div>
      <div class="opt"><label data-i18n="ratio"></label><div class="seg" id="seg_photoR"></div></div>

      <button class="btn" id="photoBtn" onclick="genPhoto()" data-i18n="generate"></button>
      <div id="photoResult"></div>
    </div>
  </section>

  <section id="video" class="tool">
    <h2 data-i18n="video_title"></h2>
    <div class="card">
      <select id="videoModel"></select>
      <textarea id="videoPrompt" data-i18n-ph="video_ph"></textarea>

      <div class="opt">
        <label data-i18n="ref_label"></label>
        <div class="refbox" id="refbox_video"></div>
      </div>
      <div class="opt"><label data-i18n="resolution"></label><div class="seg" id="seg_videoQ"></div></div>
      <div class="opt"><label data-i18n="duration"></label><div class="seg" id="seg_videoD"></div></div>

      <button class="btn" id="videoBtn" onclick="genVideo()" data-i18n="generate"></button>
      <div id="videoResult"></div>
    </div>
  </section>

  <section id="plans" class="tool">
    <h2 data-i18n="plans_title"></h2>
    <div class="grid three">
      <div class="card plan">
        <h3 data-i18n="free"></h3><div class="price">$0</div>
        <ul><li data-i18n="f_chat100"></li><li data-i18n="f_photo20"></li><li data-i18n="f_q"></li><li data-i18n="f_video3"></li><li data-i18n="f_ads"></li></ul>
        <button class="btn ghost" onclick="showTab('chat')" data-i18n="start"></button>
      </div>
      <div class="card plan pro">
        <h3>⭐ PRO</h3><div class="price">$10<small style="font-size:14px;font-weight:400" data-i18n="per_month"></small></div>
        <ul><li data-i18n="p_video"></li><li data-i18n="p_photo"></li><li data-i18n="p_dur"></li><li data-i18n="p_chat"></li></ul>
        <button class="btn" onclick="alert(t('soon'))" data-i18n="choose"></button>
      </div>
      <div class="card plan ultra">
        <h3>💎 ULTRA</h3><div class="price">$20<small style="font-size:14px;font-weight:400" data-i18n="per_month"></small></div>
        <ul><li data-i18n="u_all"></li><li data-i18n="u_dur"></li><li data-i18n="u_noads"></li></ul>
        <button class="btn" onclick="alert(t('soon'))" data-i18n="choose"></button>
      </div>
    </div>
  </section>

  <section id="faq" class="tool">
    <h2 data-i18n="faq_title"></h2>
    <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
    <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
    <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
    <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
  </section>
</main>

<div id="lib" onclick="if(event.target===this)closeLib()">
  <div class="lib-box">
    <div class="side-head"><h3 data-i18n="lib_title"></h3><button class="icon" onclick="closeLib()">✕</button></div>
    <div id="libGrid" class="lib-grid"></div>
  </div>
</div>

let lang=(function(){try{return localStorage.getItem('lang_v2')||'fr'}catch(e){return 'fr'}})();
function t(k){return (T[lang]&&T[lang][k])||T.fr[k]||k}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* Plan: 0 = gratis, 1 = pro, 2 = ultra (pou kounye a tout moun gratis) */
const PLAN_NAMES=['plan_free','plan_pro','plan_ultra'];
let plan=parseInt(store('plan_level')||'0',10)||0;

/* Opsyon yo, ak plan minimòm pou chak */
const CFG={
  photoQ:[{v:'std',l:'Standard 512px',min:0},{v:'hd',l:'HD 1024px',min:1},{v:'2k',l:'2K 2048px',min:2}],
  photoR:[{v:'1:1',l:'1:1',min:0},{v:'16:9',l:'16:9',min:0},{v:'9:16',l:'9:16',min:0},{v:'4:3',l:'4:3',min:0}],
  videoQ:[{v:'480',l:'480p',min:0},{v:'720',l:'720p',min:1},{v:'1080',l:'1080p',min:1},{v:'2160',l:'4K',min:2}],
  videoD:[{v:'3',l:'3 s',min:0},{v:'5',l:'5 s',min:1},{v:'10',l:'10 s',min:2}]
};
const SEL={photoQ:'std',photoR:'1:1',videoQ:'480',videoD:'3'};
/* Longè videyo a depann de modèl la (Omni 10 s, Veo 8 s, Pixverse 15 s, Grok 15 s). Pa gen kadna pou peye. */
function curVideoMax(){const s=document.getElementById('videoModel');return (VIDEO_MODELS[parseInt(s.value,10)||0]||VIDEO_MODELS[0]).maxDur}
function durList(){return [3,5,8,10,15].filter(d=>d<=curVideoMax()).map(d=>({v:String(d),l:d+' s',min:0}))}
function fixDur(){const max=curVideoMax();if(+SEL.videoD>max){const l=durList();SEL.videoD=l[l.length-1].v}}
function renderSeg(key){
  const box=document.getElementById('seg_'+key);box.innerHTML='';
  (key==='videoD'?durList():CFG[key]).forEach(o=>{
    const b=document.createElement('button');
    const locked=o.min>plan;
    b.textContent=(locked?'🔒 ':'')+o.l;
    if(locked)b.className='lock';
    if(SEL[key]===o.v&&!locked)b.className+=' on';
    b.onclick=()=>{if(locked){alert(t('locked'));return}SEL[key]=o.v;renderSeg(key)};
    box.appendChild(b);
  });
}
function renderAllSeg(){Object.keys(CFG).forEach(renderSeg)}

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  document.getElementById('langSelect').value=lang;
  document.getElementById('planBox').textContent=t(PLAN_NAMES[plan]);
  if(typeof renderRef==='function'){renderRef('photo');renderRef('video')}
  showUser();showUsage();
}
function changeLang(v){lang=v;store('lang_v2',v);applyLang()}

function openSide(){document.getElementById('side').classList.add('open');document.getElementById('overlay').classList.add('open')}
function closeSide(){document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('open')}

/* Limit chak jou (plan gratis) */
const LIMITS={chat:100,photo:20,video:3};
function today(){return new Date().toISOString().slice(0,10)}
function used(k){return parseInt(store('u_'+k+'_'+today())||'0',10)}
function bump(k){store('u_'+k+'_'+today(),String(used(k)+1));showUsage()}
function showUsage(){
  const f=k=>plan>0&&k!=='video'?'∞':Math.max(0,LIMITS[k]-used(k));
  document.getElementById('usageBox').textContent=
    t('chats')+': '+f('chat')+' '+t('left')+' · '+t('photos')+': '+f('photo')+' '+t('left')+' · '+t('videos')+': '+f('video')+' '+t('left');
}

/* Itilizatè / Google */
let user=null;
try{user=JSON.parse(store('minno_user')||'null')}catch(e){}
function showUser(){
  const av=document.getElementById('avatar');
  document.getElementById('userName').textContent=user?user.name:t('visitor');
  document.getElementById('userEmail').textContent=user?user.email:t('notconn');
  document.getElementById('loginBtn').style.display=user?'none':'inline-block';
  document.getElementById('logoutBtn').style.display=user?'inline-block':'none';
  document.getElementById('gate').classList.toggle('show',REQUIRE_LOGIN&&!!GOOGLE_CLIENT_ID&&!user);
  av.innerHTML='';
  if(user&&user.picture){const i=document.createElement('img');i.src=user.picture;av.appendChild(i)}else av.textContent='👤';
}
function onCred(resp){
  try{
    const p=JSON.parse(decodeURIComponent(escape(atob(resp.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));
    user={name:p.name,email:p.email,picture:p.picture};
    store('minno_user',JSON.stringify(user));showUser();
  }catch(e){alert(t('err'))}
}
function login(){
  if(!GOOGLE_CLIENT_ID||!window.google){alert(t('gsetup'));return}
  google.accounts.id.prompt();
}
function logout(){try{localStorage.removeItem('minno_user')}catch(e){}user=null;showUser()}
function initGoogle(){
  if(!GOOGLE_CLIENT_ID)return;
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
  s.onload=()=>{google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:onCred});
    google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'outline',size:'large'});
    google.accounts.id.renderButton(document.getElementById('gbtn2'),{theme:'outline',size:'large'});
    document.getElementById('loginBtn').style.display='none'};
  document.head.appendChild(s);
}

/* Chat */
const history=[];
function addMsg(who,text,label){
  const box=document.getElementById('chatBox');
  const d=document.createElement('div');d.className='msg '+who;
  if(label){const s=document.createElement('small');s.textContent=label;d.appendChild(s)}
  d.appendChild(document.createTextNode(text));
  box.appendChild(d);box.scrollTop=box.scrollHeight;return d;
}
async function sendChat(){
  const inp=document.getElementById('chatInput'),txt=inp.value.trim();
  if(!txt)return;
  if(plan===0&&used('chat')>=LIMITS.chat){alert(t('limit'));return}
  const sel=document.getElementById('chatModel'),model=sel.value,label=sel.options[sel.selectedIndex].text;
  const btn=document.getElementById('sendBtn');
  addMsg('user',txt);inp.value='';history.push({role:'user',content:txt});
  const wait=addMsg('ai',t('thinking'),label);btn.disabled=true;
  try{
    const sys={role:'system',content:"Reply automatically in the same language the user writes in (Haitian Creole, French, English, Spanish, etc.). Never switch language unless the user does."};
    const msgs=[sys].concat(history.slice(-12));
    const tryModels=[model,'openai','mistral','llama'].filter((m,i,a)=>a.indexOf(m)===i);
    const endpoints=['https://gen.pollinations.ai/v1/chat/completions','https://text.pollinations.ai/openai'];
    const headers={'Content-Type':'application/json'};
    if(POLLINATIONS_KEY)headers['Authorization']='Bearer '+POLLINATIONS_KEY;
    let out='';
    outer:for(const m of tryModels){
      for(const ep of endpoints){
        try{
          const r=await fetch(ep,{method:'POST',headers:headers,body:JSON.stringify({model:m,messages:msgs})});
          if(!r.ok)continue;
          const j=await r.json();
          const c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
          if(c){out=c;break outer}
        }catch(e){}
      }
    }
    if(!out)throw new Error('empty');
    wait.lastChild.textContent=out;history.push({role:'assistant',content:out});bump('chat');
  }catch(e){wait.lastChild.textContent=t('err');history.pop()}
  btn.disabled=false;
}
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});

/* Foto referans: apèsi */
const REF={photo:'',video:''};
function getGallery(){try{return JSON.parse(store('gallery')||'[]')}catch(e){return []}}
function addToGallery(u){
  if(!u||u.indexOf('http')!==0)return;
  const g=getGallery().filter(x=>x!==u);g.unshift(u);store('gallery',JSON.stringify(g.slice(0,24)));
}
function renderRef(target){
  const box=document.getElementById('refbox_'+target);box.innerHTML='';
  if(REF[target]){
    const w=document.createElement('div');w.className='ref-sel';
    const i=document.createElement('img');i.src=REF[target];
    const x=document.createElement('button');x.textContent='✕';x.onclick=()=>{REF[target]='';renderRef(target)};
    w.appendChild(i);w.appendChild(x);box.appendChild(w);
  }
  const row=document.createElement('div');row.className='ref-row';
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.style.display='none';
  inp.onchange=()=>uploadRef(target,inp.files[0]);
  const b1=document.createElement('button');b1.textContent=t('ref_gal');b1.onclick=()=>inp.click();
  const b2=document.createElement('button');b2.textContent=t('ref_lib');b2.onclick=()=>openLib(target);
  row.appendChild(inp);row.appendChild(b1);row.appendChild(b2);box.appendChild(row);
}
async function uploadRef(target,file){
  if(!file)return;
  if(!CLOUDINARY.cloud||!CLOUDINARY.preset){alert(t('up_cfg'));return}
  try{
    const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLOUDINARY.preset);
    const r=await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY.cloud+'/image/upload',{method:'POST',body:fd});
    const j=await r.json();
    if(!j.secure_url)throw new Error('upload');
    REF[target]=j.secure_url;addToGallery(j.secure_url);renderRef(target);
  }catch(e){alert(t('err'))}
}
function openLib(target){
  const g=getGallery(),grid=document.getElementById('libGrid');grid.innerHTML='';
  if(!g.length){grid.style.display='block';grid.textContent=t('lib_empty')}
  else{
    grid.style.display='grid';
    g.forEach(u=>{const i=document.createElement('img');i.src=u;i.loading='lazy';
      i.onclick=()=>{REF[target]=u;renderRef(target);closeLib()};grid.appendChild(i)});
  }
  document.getElementById('lib').classList.add('open');
}
function closeLib(){document.getElementById('lib').classList.remove('open')}

/* Foto */
function photoSize(){
  const long={std:512,hd:1024,'2k':2048}[SEL.photoQ]||512;
  const p=SEL.photoR.split(':'),a=+p[0],b=+p[1];
  const w=a>=b?long:Math.round(long*a/b),h=a>=b?Math.round(long*b/a):long;
  return {w:w,h:h};
}
function genPhoto(){
  const p=document.getElementById('photoPrompt').value.trim();
  if(!p)return;
  if(plan===0&&used('photo')>=LIMITS.photo){alert(t('limit'));return}
  const out=document.getElementById('photoResult'),btn=document.getElementById('photoBtn');
  out.textContent=t('thinking');btn.disabled=true;
  let model=document.getElementById('photoModel').value;
  const ref=REF.photo,sz=photoSize(),seed=Math.floor(Math.random()*1e6);
  const url=m=>{
    const q='?model='+m+'&width='+sz.w+'&height='+sz.h+'&seed='+seed+(ref?'&image='+encodeURIComponent(ref):'');
    return POLLINATIONS_KEY
      ?'https://gen.pollinations.ai/image/'+encodeURIComponent(p)+q+'&key='+encodeURIComponent(POLLINATIONS_KEY)
      :'https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+q+'&nologo=true';
  };
  const img=new Image();img.className='res';img.alt=p;
  let retried=false;
  img.onload=()=>{out.innerHTML='';out.appendChild(img);btn.disabled=false;bump('photo');addToGallery(img.src)};
  img.onerror=()=>{
    if(!retried&&model!=='flux'){retried=true;img.src=url('flux');return}
    out.textContent=t('err');btn.disabled=false;
  };
  img.src=url(model);
}

/* Vidéo */
async function genVideo(){
  const p=document.getElementById('videoPrompt').value.trim();
  if(!p)return;
  if(plan===0&&used('video')>=LIMITS.video){alert(t('vlimit'));return}
  const cfg=VIDEO_MODELS[parseInt(document.getElementById('videoModel').value,10)||0],model=cfg.id,ref=REF.video;
  const out=document.getElementById('videoResult'),btn=document.getElementById('videoBtn');
  out.textContent=t('thinking');btn.disabled=true;
  try{
    let u;
    if(cfg.url){
      u=cfg.url.replace('{prompt}',encodeURIComponent(p)).replace('{duration}',SEL.videoD).replace('{resolution}',SEL.videoQ)
        .replace('{image}',encodeURIComponent(ref)).replace('{key}',encodeURIComponent(cfg.key||''));
    }else{
      const q='?model='+model+'&duration='+SEL.videoD+'&resolution='+SEL.videoQ+'p&seed='+Math.floor(Math.random()*1e6)+(ref?'&image='+encodeURIComponent(ref):'');
      u=POLLINATIONS_KEY
        ?'https://gen.pollinations.ai/image/'+encodeURIComponent(p)+q+'&key='+encodeURIComponent(POLLINATIONS_KEY)
        :'https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+q+'&nologo=true';
    }
    const r=await fetch(u);
    const type=r.headers.get('content-type')||'';
    if(!r.ok||type.indexOf('video')!==0)throw new Error('novideo');
    const blob=await r.blob();
    const v=document.createElement('video');v.className='res';v.controls=true;v.autoplay=true;v.loop=true;v.playsInline=true;
    v.src=URL.createObjectURL(blob);
    out.innerHTML='';out.appendChild(v);bump('video');
  }catch(e){out.textContent=t('video_err')}
  btn.disabled=false;
}

/* Onglè: yon sèl zouti afiche a la fwa */
function showTab(n){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===n));
  document.querySelectorAll('.tool').forEach(s=>s.classList.toggle('on',s.id===n));
}
function fromHash(){
  const h=location.hash.slice(1);
  if(['chat','photo','video','plans','faq'].indexOf(h)>-1)showTab(h);
}
window.addEventListener('hashchange',fromHash);
fromHash();

(function(){const s=document.getElementById('videoModel');VIDEO_MODELS.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m.label;s.appendChild(o)})})();
document.getElementById('videoModel').addEventListener('change',()=>{fixDur();renderSeg('videoD')});
renderAllSeg();renderRef('photo');renderRef('video');applyLang();initGoogle();
